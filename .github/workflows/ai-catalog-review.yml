name: AI catalog review

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run never calls a provider; invoke calls Alibaba after you confirm free quota"
        required: true
        type: choice
        options:
          - dry-run
          - invoke
        default: dry-run
      model:
        description: "Model already confirmed safe/free in the Bailian console"
        required: true
        default: "qwen-plus"

permissions:
  contents: read

jobs:
  catalog-review:
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      DASHSCOPE_MODEL: ${{ inputs.model }}
      AI_REVIEW_MAX_TOKENS: "900"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Generate dry-run review artifact
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          mkdir -p artifacts
          python scripts/ai_catalog_review.py \
            --mode dry-run \
            --output artifacts/catalog-review.md
      - name: Generate AI review artifact
        if: ${{ inputs.mode == 'invoke' }}
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          mkdir -p artifacts
          python scripts/ai_catalog_review.py \
            --mode invoke \
            --output artifacts/catalog-review.md
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-catalog-review-${{ github.run_id }}
          path: artifacts/catalog-review.md
          if-no-files-found: error
