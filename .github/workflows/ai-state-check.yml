name: AI state check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-ai-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate AI workflow state
        run: python scripts/check_ai_state.py
