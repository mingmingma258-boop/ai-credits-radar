<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Auditable free AI API, GPU and cloud credits catalog" />
    <title>AI Credits Radar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="eyebrow">AI CREDITS RADAR · VERIFIED CATALOG</div>
        <h1>把免费资源，变成可执行的路线图。</h1>
        <p class="lede">按官方证据筛选 AI API、GPU、云试用和 startup credits。额度是线索，不是保证；每一条都告诉你下一步和需要交接的位置。</p>
        <div class="hero-meta">
          <span id="review-date">Loading catalog…</span>
          <span class="dot">•</span>
          <span>不保存密钥 · 不绕过验证 · 不自动升级付费</span>
        </div>
      </header>

      <section class="controls" aria-label="Filters">
        <label class="search-box">
          <span class="sr-only">Search</span>
          <input id="search" type="search" placeholder="搜索 provider、用途、资格或标签…" autocomplete="off" />
        </label>
        <select id="kind" aria-label="资源类型">
          <option value="">全部类型</option>
          <option value="api">API</option>
          <option value="gpu">GPU</option>
          <option value="cloud">Cloud</option>
          <option value="startup">Startup</option>
          <option value="student">Student</option>
          <option value="trial">Trial</option>
          <option value="developer">Developer</option>
        </select>
        <select id="access" aria-label="进入方式">
          <option value="">全部入口</option>
          <option value="free-tier">免费层</option>
          <option value="account-signup">账号注册</option>
          <option value="application">申请审核</option>
          <option value="student">学生资格</option>
          <option value="partner-portal">合作方入口</option>
        </select>
        <label class="check"><input id="applications" type="checkbox" /> 只看可申请</label>
      </section>

      <section id="stats" class="stats" aria-live="polite"></section>
      <section id="list" class="cards" aria-live="polite"></section>
      <p id="error" class="error" hidden></p>

      <footer>
        <span>数据由 <code>data/programs.json</code> 驱动。</span>
        <a href="../docs/application-playbook.md">申请清单</a>
        <a href="https://github.com/mingmingma258-boop/ai-credits-radar" rel="noreferrer">GitHub</a>
      </footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
